<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – AI Study Planner</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>AI Study Planner</h1>
    <p class="subtitle">Your personal AI-powered study companion</p>
  </header>
  <main>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showTab('login')">Login</button>
        <button class="auth-tab" onclick="showTab('signup')">Sign Up</button>
      </div>

      <div id="login-form">
        <h2>Welcome back</h2>
        <input type="text" id="login-username" placeholder="Username" />
        <input type="password" id="login-password" placeholder="Password" />
        <button class="btn-primary" onclick="login()">Login</button>
        <p class="auth-error hidden" id="login-error">Invalid username or password.</p>
      </div>

      <div id="signup-form" class="hidden">
        <h2>Create an account</h2>
        <input type="text" id="signup-name" placeholder="Your name" />
        <input type="text" id="signup-username" placeholder="Username" />
        <input type="password" id="signup-password" placeholder="Password" />
        <button class="btn-primary" onclick="signup()">Sign Up</button>
        <p class="auth-error hidden" id="signup-error"></p>
      </div>
    </div>
  </main>
  <script>
    if (localStorage.getItem('sp_user')) window.location.href = 'index.html';

    function showTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.auth-tab[onclick="showTab('${tab}')"]`).classList.add('active');
      document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
      document.getElementById('signup-form').classList.toggle('hidden', tab !== 'signup');
    }

    function login() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const users = JSON.parse(localStorage.getItem('sp_users') || '{}');
      if (users[username] && users[username].password === password) {
        localStorage.setItem('sp_user', JSON.stringify({ username, name: users[username].name }));
        window.location.href = 'index.html';
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    function signup() {
      const name = document.getElementById('signup-name').value.trim();
      const username = document.getElementById('signup-username').value.trim();
      const password = document.getElementById('signup-password').value;
      const err = document.getElementById('signup-error');
      if (!name || !username || !password) { err.textContent = 'All fields required.'; err.classList.remove('hidden'); return; }
      const users = JSON.parse(localStorage.getItem('sp_users') || '{}');
      if (users[username]) { err.textContent = 'Username already taken.'; err.classList.remove('hidden'); return; }
      users[username] = { name, password };
      localStorage.setItem('sp_users', JSON.stringify(users));
      localStorage.setItem('sp_user', JSON.stringify({ username, name }));
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
