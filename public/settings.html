<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings – AI Study Planner</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>Settings</h1>
    <p class="subtitle">Customize your study planner</p>
  </header>
  <main>
    <div class="card">
      <h2>Profile</h2>
      <label>Your Name</label>
      <input type="text" id="setting-name" placeholder="Your name" />
      <label>Default Study Hours Per Day</label>
      <input type="number" id="setting-hours" min="1" max="12" value="3" />
    </div>

    <div class="card">
      <h2>Appearance</h2>
      <div class="setting-row">
        <span>Dark Mode</span>
        <label class="toggle">
          <input type="checkbox" id="dark-mode-toggle" onchange="toggleDark(this)"/>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <h2>Data</h2>
      <button class="btn-danger" onclick="clearData()">Clear All Saved Schedules</button>
    </div>

    <div style="display:flex; gap:12px;">
      <button class="btn-primary" onclick="saveSettings()">Save Settings</button>
      <button class="btn-secondary" onclick="window.location.href='index.html'">← Back to App</button>
    </div>

    <p id="save-msg" class="hidden" style="color:#667eea; font-weight:600; margin-top:0.5rem;">Settings saved!</p>
  </main>
  <script>
    const user = JSON.parse(localStorage.getItem('sp_user') || '{}');
    const settings = JSON.parse(localStorage.getItem('sp_settings') || '{}');

    document.getElementById('setting-name').value = settings.name || user.name || '';
    document.getElementById('setting-hours').value = settings.hours || 3;
    document.getElementById('dark-mode-toggle').checked = settings.darkMode || false;
    if (settings.darkMode) document.body.classList.add('dark');

    function toggleDark(el) {
      document.body.classList.toggle('dark', el.checked);
    }

    function saveSettings() {
      const s = {
        name: document.getElementById('setting-name').value.trim(),
        hours: document.getElementById('setting-hours').value,
        darkMode: document.getElementById('dark-mode-toggle').checked
      };
      localStorage.setItem('sp_settings', JSON.stringify(s));
      document.getElementById('save-msg').classList.remove('hidden');
      setTimeout(() => document.getElementById('save-msg').classList.add('hidden'), 2000);
    }

    function clearData() {
      if (confirm('Clear all saved schedules and flashcards?')) {
        localStorage.removeItem('sp_schedules');
        localStorage.removeItem('sp_progress');
        alert('Data cleared.');
      }
    }
  </script>
</body>
</html>
